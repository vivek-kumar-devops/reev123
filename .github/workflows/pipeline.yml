name: Terraform Plan

on:
  pull_request:
   branches:
  - main

  workflow_dispatch:

jobs:
  terraform-plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
      run: terraform plan
    working-directory: environments/preprod

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan
            working-directory: environments/preprod
